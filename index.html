<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Say Hello Bristol</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #ffffff;
      font-family: Georgia, serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      min-height: 100vh;
    }

    h1 {
      font-size: 2rem;
      font-weight: normal;
      color: #222;
      margin-bottom: 32px;
      letter-spacing: 0.02em;
    }

    #map-container {
      position: relative;
      width: 100%;
      max-width: 800px;
      aspect-ratio: 4 / 3;
      background: #e8e8e8;
      border-radius: 8px;
      overflow: hidden;
    }

    /* Pin styles */
    .pin {
      cursor: pointer;
    }

    .pin circle,
    .pin polygon,
    .pin rect {
      transition: filter 0.15s;
    }

    .pin:hover circle,
    .pin:hover polygon,
    .pin:hover rect {
      filter: brightness(0.78);
    }

    .pin.active circle,
    .pin.active polygon,
    .pin.active rect {
      filter: brightness(0.62);
    }

    /* Popup card — positioned by JS */
    #card {
      position: absolute;
      width: 256px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.18);
      padding: 20px 18px 18px;
      z-index: 10;
      visibility: hidden;
    }

    #card.visible {
      visibility: visible;
    }

    #card-close {
      position: absolute;
      top: 10px;
      right: 12px;
      background: none;
      border: none;
      font-size: 1.3rem;
      color: #bbb;
      cursor: pointer;
      line-height: 1;
      padding: 2px 4px;
    }

    #card-close:hover {
      color: #444;
    }

    #card-name {
      font-size: 1.25rem;
      font-weight: normal;
      color: #222;
      margin-bottom: 8px;
      padding-right: 22px;
    }

    #card-ipa {
      display: inline-block;
      background: #f3f1ee;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 1rem;
      color: #444;
      margin-bottom: 16px;
      letter-spacing: 0.03em;
    }

    .card-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #aaa;
      margin-bottom: 4px;
      font-family: sans-serif;
    }

    .card-text {
      font-size: 0.88rem;
      color: #555;
      line-height: 1.6;
      margin-bottom: 14px;
    }

    .card-text:last-child {
      margin-bottom: 0;
    }

    .coming-soon {
      font-size: 0.88rem;
      color: #bbb;
      font-style: italic;
    }

    /* Audio controls */
    #card-audio {
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid #efefef;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .audio-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .audio-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      border-radius: 20px;
      border: 1.5px solid transparent;
      font-size: 0.78rem;
      font-family: sans-serif;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
      line-height: 1.4;
    }

    #btn-listen {
      background: #f5f5f5;
      border-color: #ddd;
      color: #444;
    }
    #btn-listen:hover  { background: #eaeaea; }
    #btn-listen.active { background: #E07850; border-color: #E07850; color: #fff; }

    #btn-record {
      background: #fff0f0;
      border-color: #f0c0c0;
      color: #b03020;
    }
    #btn-record:hover  { background: #ffe4e4; }

    #btn-stop-rec {
      background: #c0392b;
      border-color: #c0392b;
      color: #fff;
    }
    #btn-stop-rec:hover { background: #a93226; border-color: #a93226; }

    #btn-playback {
      background: #f0f7ff;
      border-color: #b8d8f5;
      color: #1a6fa0;
    }
    #btn-playback:hover  { background: #e2efff; }
    #btn-playback.active { background: #1a6fa0; border-color: #1a6fa0; color: #fff; }

    #btn-rerecord {
      background: none;
      border-color: #ddd;
      color: #aaa;
    }
    #btn-rerecord:hover { color: #666; border-color: #bbb; }

    #legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 28px;
      margin-top: 14px;
      max-width: 800px;
      width: 100%;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .legend-dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .legend-label {
      font-family: sans-serif;
      font-size: 0.78rem;
      color: #666;
      letter-spacing: 0.01em;
    }
  </style>
</head>
<body>

    <!-- Popup card lives inside the map so it's clipped to the map boundary -->

  <script src="bristol-data.js"></script>
  <script>
    const places = PLACES;

    const mapContainer  = document.getElementById('map-container');
    const card          = document.getElementById('card');
    const cardName      = document.getElementById('card-name');
    const cardIpa       = document.getElementById('card-ipa');
    const cardTeaching  = document.getElementById('card-teaching');
    const cardExtra     = document.getElementById('card-extra');
    const labelTeaching = document.getElementById('label-teaching');
    const labelExtra    = document.getElementById('label-extra');
    const cardAudio     = document.getElementById('card-audio');
    const btnListen     = document.getElementById('btn-listen');
    const btnRecord     = document.getElementById('btn-record');
    const btnStopRec    = document.getElementById('btn-stop-rec');
    const btnPlayback   = document.getElementById('btn-playback');
    const btnRerecord   = document.getElementById('btn-rerecord');

    let activePin  = null;
    let modelAudio = null;  // HTMLAudioElement for the model pronunciation
    let recorder   = null;  // MediaRecorder
    let recChunks  = [];
    let recUrl     = null;  // object URL for the user's recording
    let recAudio   = null;  // HTMLAudioElement for playback of recording
    let recStream  = null;  // MediaStream held open during recording

    // ── Audio helpers ───────────────────────────────────────────────────────

    function stopModel() {
      if (modelAudio) { modelAudio.pause(); modelAudio = null; }
      btnListen.classList.remove('active');
      btnListen.textContent = '▶ Listen';
    }

    function stopPlayback() {
      if (recAudio) { recAudio.pause(); recAudio = null; }
      btnPlayback.classList.remove('active');
      btnPlayback.textContent = '▶ My recording';
    }

    function stopStream() {
      if (recStream) { recStream.getTracks().forEach(t => t.stop()); recStream = null; }
    }

    function resetAudio() {
      stopModel();
      stopPlayback();
      stopStream();
      if (recorder && recorder.state !== 'inactive') recorder.stop();
      recorder  = null;
      recChunks = [];
      if (recUrl) { URL.revokeObjectURL(recUrl); recUrl = null; }
      btnRecord.style.display   = '';
      btnStopRec.style.display  = 'none';
      btnPlayback.style.display = 'none';
      btnRerecord.style.display = 'none';
    }

    // ── Card content ────────────────────────────────────────────────────────

    function populateCard(entry, name) {
      cardName.textContent = name;
      cardTeaching.classList.remove('coming-soon');
      resetAudio();

      if (entry) {
        cardIpa.textContent          = entry.ipa;
        cardIpa.style.display        = 'inline-block';
        cardTeaching.textContent     = entry.teachingNote;
        cardExtra.textContent        = entry.extraNote;
        labelTeaching.style.display  = 'block';
        labelExtra.style.display     = 'block';
        if (entry.audio) {
          cardAudio.style.display = '';
          btnListen.dataset.src   = entry.audio;
        } else {
          cardAudio.style.display = 'none';
        }
      } else {
        cardIpa.style.display        = 'none';
        cardTeaching.textContent     = 'Pronunciation guide coming soon.';
        cardTeaching.classList.add('coming-soon');
        cardExtra.textContent        = '';
        labelTeaching.style.display  = 'none';
        labelExtra.style.display     = 'none';
        cardAudio.style.display      = 'none';
      }
    }

    function positionCard(pin) {
      const mapRect = mapContainer.getBoundingClientRect();
      const pinRect = (pin.querySelector('circle') || pin.querySelector('polygon')).getBoundingClientRect();

      const pinX = pinRect.left + pinRect.width  / 2 - mapRect.left;
      const pinY = pinRect.top  + pinRect.height / 2 - mapRect.top;

      const gap   = 16;
      const pad   = 10;
      const cardW = card.offsetWidth;
      const cardH = card.offsetHeight;

      let left = pinX + gap;
      let top  = pinY - cardH / 2;

      if (left + cardW > mapRect.width - pad) left = pinX - cardW - gap;

      top  = Math.max(pad, Math.min(top,  mapRect.height - cardH - pad));
      left = Math.max(pad, left);

      card.style.left = left + 'px';
      card.style.top  = top  + 'px';
    }

    // ── Pin interaction ─────────────────────────────────────────────────────

    document.querySelectorAll('.pin').forEach(pin => {
      pin.addEventListener('click', () => {
        const name  = pin.dataset.place;
        const entry = places.find(p => p.name === name);

        if (activePin) activePin.classList.remove('active');
        activePin = pin;
        pin.classList.add('active');

        populateCard(entry, name);

        card.style.visibility = 'hidden';
        card.style.display    = 'block';
        positionCard(pin);
        card.classList.add('visible');
        card.style.display    = '';
        card.style.visibility = '';
      });
    });

    document.getElementById('card-close').addEventListener('click', () => {
      card.classList.remove('visible');
      resetAudio();
      if (activePin) { activePin.classList.remove('active'); activePin = null; }
    });

    mapContainer.addEventListener('click', e => {
      if (e.target === mapContainer || e.target.tagName === 'svg' ||
          e.target.closest('rect') === mapContainer.querySelector('rect')) {
        card.classList.remove('visible');
        resetAudio();
        if (activePin) { activePin.classList.remove('active'); activePin = null; }
      }
    });

    // ── Audio button events ─────────────────────────────────────────────────

    btnListen.addEventListener('click', () => {
      if (modelAudio && !modelAudio.paused) { stopModel(); return; }
      stopPlayback();
      const src = btnListen.dataset.src;
      if (!src) return;
      modelAudio = new Audio(src);
      modelAudio.play().catch(() => {});
      btnListen.classList.add('active');
      btnListen.textContent = '■ Playing…';
      modelAudio.onended = stopModel;
    });

    btnRecord.addEventListener('click', async () => {
      stopModel();
      stopPlayback();
      try {
        recStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        recChunks = [];
        const opts = MediaRecorder.isTypeSupported('audio/webm') ? { mimeType: 'audio/webm' } : {};
        recorder  = new MediaRecorder(recStream, opts);
        recorder.ondataavailable = e => { if (e.data.size > 0) recChunks.push(e.data); };
        recorder.onstop = () => {
          stopStream();
          if (recUrl) URL.revokeObjectURL(recUrl);
          recUrl = URL.createObjectURL(new Blob(recChunks, { type: recorder.mimeType || 'audio/webm' }));
          btnStopRec.style.display  = 'none';
          btnPlayback.style.display = '';
          btnRerecord.style.display = '';
        };
        recorder.start();
        btnRecord.style.display  = 'none';
        btnStopRec.style.display = '';
      } catch (_) {
        stopStream();
      }
    });

    btnStopRec.addEventListener('click', () => {
      if (recorder && recorder.state === 'recording') recorder.stop();
    });

    btnPlayback.addEventListener('click', () => {
      if (recAudio && !recAudio.paused) { stopPlayback(); return; }
      stopModel();
      if (!recUrl) return;
      recAudio = new Audio(recUrl);
      recAudio.play().catch(() => {});
      btnPlayback.classList.add('active');
      btnPlayback.textContent = '■ Playing…';
      recAudio.onended = stopPlayback;
    });

    btnRerecord.addEventListener('click', () => {
      stopModel();
      stopPlayback();
      if (recUrl) { URL.revokeObjectURL(recUrl); recUrl = null; }
      btnRecord.style.display   = '';
      btnStopRec.style.display  = 'none';
      btnPlayback.style.display = 'none';
      btnRerecord.style.display = 'none';
    });

    // Warm up mic permission once on page load so the browser prompt never interrupts recording
    navigator.mediaDevices?.getUserMedia({ audio: true })
      .then(stream => stream.getTracks().forEach(t => t.stop()))
      .catch(() => {});
  </script>
</body>
</html>
